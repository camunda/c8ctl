name: Agentic Validate

on:
  pull_request:
    paths:
      - .github/gh-aw-version
      - .github/aw/**
      - .github/workflows/agentic-*
      - .github/workflows/shared/agentic-*.md
      - scripts/agentic/**
      - tests/unit/agentic-*.test.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install the declared compiler and verify its version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agentic/maintenance.ts install
      - name: Strict compilation and complete generated-file drift check
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agentic/maintenance.ts check
