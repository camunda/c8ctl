name: Test
run-name: ${{ inputs.agentic_task != '' && format('c8ctl-ci-{0}', fromJSON(inputs.agentic_task).correlation) || github.event.pull_request.title || 'Test' }}

on:

  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      agentic_task:
        description: Reserved immutable automation CI task; leave empty for ordinary CI
        type: string
        required: false
        default: ''

jobs:
  agentic-revision:
    name: Agentic CI Revision
    if: ${{ inputs.agentic_task != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      checkout_sha: ${{ steps.revision.outputs.checkout_sha }}
      correlation: ${{ steps.revision.outputs.correlation }}
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: revision
        name: Authenticate reserved PR, base, and synthetic merge
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TASK_JSON: ${{ inputs.agentic_task }}
          C8CTL_APP_BOT_LOGIN: ${{ vars.C8CTL_APP_BOT_LOGIN }}
          C8CTL_AUTOMATION_ENABLED: ${{ vars.C8CTL_AUTOMATION_ENABLED }}
        run: node --experimental-strip-types scripts/agentic/ci.ts prepare

  lint:
    name: Lint
    needs: [agentic-revision]
    if: ${{ !cancelled() && (inputs.agentic_task == '' || needs.agentic-revision.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.agentic_task != '' && needs.agentic-revision.outputs.checkout_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    needs: [agentic-revision]
    if: ${{ !cancelled() && (inputs.agentic_task == '' || needs.agentic-revision.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.agentic_task != '' && needs.agentic-revision.outputs.checkout_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  unit-test:
    name: Unit Test (Node ${{ matrix.node }} / ${{ matrix.os }})
    needs: [agentic-revision, lint, typecheck]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.typecheck.result == 'success' && (inputs.agentic_task == '' || needs.agentic-revision.result == 'success') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.agentic_task != '' && needs.agentic-revision.outputs.checkout_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AGENTS.md documents `npm run build` before `npm test` locally, because
      # some tests exercise the *published* dist layout and skip themselves when
      # it is absent (tests/unit/plugin-host-compat.test.ts needs a dist/ whose
      # package.json carries a real version). Without a build step CI silently ran
      # the weaker subset — a skipped test looks identical to a passing one in the
      # summary.
      #
      # One leg only. Those tests assert OS-agnostic logic, and `npm run build`
      # re-runs `npm run lint` (already its own job) and rewrites the synced
      # README/docs blocks, so paying for it six times buys nothing. The other
      # legs keep skipping them, which is what the skip reason is for.
      - name: Build (for tests that exercise the published dist layout)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

  integration-test:
    name: Integration Test (Node ${{ matrix.node }} / Camunda ${{ matrix.camunda }} / ${{ matrix.os }})
    needs: [agentic-revision]
    if: ${{ !cancelled() && (inputs.agentic_task == '' || needs.agentic-revision.result == 'success') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        camunda: ['8.8', '8.9', '8.10']
        os: [ubuntu-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.agentic_task != '' && needs.agentic-revision.outputs.checkout_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Camunda ${{ matrix.camunda }} with Docker Compose
        working-directory: assets/c8/${{ matrix.camunda }}
        run: docker compose up -d

      - name: Wait for Camunda to be ready
        shell: bash
        run: |
          echo "Waiting for Camunda at localhost:8080..."
          # First wait for topology endpoint
          for i in {1..60}; do
            if curl -s -f -u demo:demo http://localhost:8080/v2/topology > /dev/null; then
              echo "Topology endpoint is ready!"
              break
            fi
            echo "Attempt $i: Topology not ready yet, waiting..."
            sleep 5
          done
          
          # # Then wait an additional 30 seconds for broker to fully initialize
          # echo "Waiting additional time for broker to initialize..."
          # # let's try removing this and rely on topology detecting health instead
          # sleep 30 
          
          # Verify we can actually deploy
          echo "Testing deployment capability..."
          for i in {1..30}; do
            if curl -s -u demo:demo http://localhost:8080/v2/topology | grep -q '"health":"healthy"'; then
              echo "Broker is healthy, ready for deployments!"
              exit 0
            fi
            echo "Attempt $i: Broker not fully ready, waiting..."
            sleep 2
          done
          
          echo "Camunda may not be fully ready, but continuing with tests..."

      - name: Run integration tests
        run: npm run test:integration
        env:
          CAMUNDA_VERSION: ${{ matrix.camunda }}

      - name: Show Camunda logs on failure
        if: failure()
        working-directory: assets/c8/${{ matrix.camunda }}
        run: docker compose logs

      - name: Stop Camunda
        if: always()
        working-directory: assets/c8/${{ matrix.camunda }}
        run: docker compose down -v

  agentic-ci-receipt:
    name: Agentic CI Receipt
    needs: [agentic-revision, lint, typecheck, unit-test, integration-test]
    if: >-
      always() && inputs.agentic_task != '' &&
      needs.agentic-revision.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      github.actor == vars.C8CTL_APP_BOT_LOGIN &&
      github.run_attempt == '1' &&
      vars.C8CTL_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Publish immutable tested-revision receipt
        env:
          CI_TASK_JSON: ${{ inputs.agentic_task }}
          CI_TESTED_SHA: ${{ needs.agentic-revision.outputs.checkout_sha }}
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          CI_REPORT_OUT: ${{ runner.temp }}/report.json
          C8CTL_APP_BOT_LOGIN: ${{ vars.C8CTL_APP_BOT_LOGIN }}
          C8CTL_AUTOMATION_ENABLED: ${{ vars.C8CTL_AUTOMATION_ENABLED }}
        run: node --experimental-strip-types scripts/agentic/ci.ts publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-report-${{ needs.agentic-revision.outputs.correlation }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/report.json
          if-no-files-found: error
          retention-days: 7
