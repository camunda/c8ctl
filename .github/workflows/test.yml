name: Test

on:

  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

  unit-test:
    name: Unit Test (Node ${{ matrix.node }} / ${{ matrix.os }} / shard ${{ matrix.shard }})
    needs: [lint, typecheck]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: ['1/4', '2/4', '3/4', '4/4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # AGENTS.md documents `npm run build` before `npm test` locally, because
      # some tests exercise the *published* dist layout and skip themselves when
      # it is absent (tests/unit/plugin-host-compat.test.ts needs a dist/ whose
      # package.json carries a real version). Without a build step CI silently ran
      # the weaker subset — a skipped test looks identical to a passing one in the
      # summary.
      #
      # One leg only. Those tests assert OS-agnostic logic, and `npm run build`
      # re-runs `npm run lint` (already its own job) and rewrites the synced
      # README/docs blocks, so paying for it six times buys nothing. The other
      # legs keep skipping them, which is what the skip reason is for.
      - name: Build (for tests that exercise the published dist layout)
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run build

      # Sharded with node's built-in --test-shard, passed via NODE_OPTIONS because
      # the flag must precede the file globs in the `test:unit` script: given
      # after them (e.g. `npm run test:unit -- --test-shard=1/4`) node silently
      # ignores it and every shard runs the whole suite.
      - name: Run unit tests (shard ${{ matrix.shard }})
        run: npm run test:unit
        env:
          NODE_OPTIONS: --test-shard=${{ matrix.shard }} --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./.github/dbg-reporter.mjs --test-reporter-destination=stdout

  integration-test:
    name: Integration Test (Node ${{ matrix.node }} / Camunda ${{ matrix.camunda }} / ${{ matrix.os }} / shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
        camunda: ['8.8', '8.9', '8.10']
        os: [ubuntu-latest]
        shard: ['1/3', '2/3', '3/3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start Camunda ${{ matrix.camunda }} with Docker Compose
        working-directory: assets/c8/${{ matrix.camunda }}
        run: docker compose up -d

      - name: Wait for Camunda to be ready
        shell: bash
        run: |
          echo "Waiting for Camunda at localhost:8080..."
          # First wait for topology endpoint
          for i in {1..60}; do
            if curl -s -f -u demo:demo http://localhost:8080/v2/topology > /dev/null; then
              echo "Topology endpoint is ready!"
              break
            fi
            echo "Attempt $i: Topology not ready yet, waiting..."
            sleep 5
          done
          
          # # Then wait an additional 30 seconds for broker to fully initialize
          # echo "Waiting additional time for broker to initialize..."
          # # let's try removing this and rely on topology detecting health instead
          # sleep 30 
          
          # Verify we can actually deploy
          echo "Testing deployment capability..."
          for i in {1..30}; do
            if curl -s -u demo:demo http://localhost:8080/v2/topology | grep -q '"health":"healthy"'; then
              echo "Broker is healthy, ready for deployments!"
              exit 0
            fi
            echo "Attempt $i: Broker not fully ready, waiting..."
            sleep 2
          done
          
          echo "Camunda may not be fully ready, but continuing with tests..."

      # Each shard has its own runner and its own Camunda instance. The shard is
      # passed via NODE_OPTIONS for the same reason as in the unit tests: it
      # works with --experimental-test-isolation=none, whereas a flag appended
      # after the file globs is silently ignored.
      - name: Run integration tests (shard ${{ matrix.shard }})
        run: npm run test:integration
        env:
          CAMUNDA_VERSION: ${{ matrix.camunda }}
          NODE_OPTIONS: --test-shard=${{ matrix.shard }}

      - name: Show Camunda logs on failure
        if: failure()
        working-directory: assets/c8/${{ matrix.camunda }}
        run: docker compose logs

      - name: Stop Camunda
        if: always()
        working-directory: assets/c8/${{ matrix.camunda }}
        run: docker compose down -v

  # Single stable check for branch protection: the matrix jobs above have
  # shard-suffixed names, so require this job instead of listing each leg.
  test-gate:
    name: Tests passed
    if: always()
    needs: [lint, typecheck, unit-test, integration-test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any required job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
