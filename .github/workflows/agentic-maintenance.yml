name: Agentic Compiler Maintenance

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - .github/gh-aw-version
      - .github/workflows/agentic-*.lock.yml
      - .github/aw/**
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open same-repository Renovate compiler update PR number
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agentic-compiler-${{ github.event.pull_request.number || inputs.pull_request }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.C8CTL_AUTOMATION_ENABLED == 'true' &&
      vars.C8CTL_DEPENDENCY_MAINTENANCE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.pull_request.user.login == 'renovate[bot]' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pull_request: ${{ steps.prepare.outputs.pull_request }}
      head_sha: ${{ steps.prepare.outputs.head_sha }}
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - id: prepare
        name: Authenticate candidate PR, diff, and published latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_PR: ${{ github.event.pull_request.number || inputs.pull_request }}
        run: node scripts/agentic/maintenance.ts prepare

  compile:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install validated candidate in a read-only job
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/agentic/maintenance.ts install
      - name: Compile trusted sources and collect bounded generated bytes
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_PR: ${{ needs.prepare.outputs.pull_request }}
          MAINTENANCE_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          MAINTENANCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/agentic/maintenance.ts collect
      - id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regeneration-${{ github.run_id }}-${{ github.run_attempt }}
          path: regeneration.json
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: [prepare, compile]
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.C8CTL_AUTOMATION_ENABLED == 'true' &&
      vars.C8CTL_DEPENDENCY_MAINTENANCE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.compile.outputs.artifact_id }}
          path: regeneration-input
          merge-multiple: true
      - id: app
        name: Mint repository-scoped maintenance token with Variables read
        env:
          C8CTL_APP_CLIENT_ID: ${{ vars.C8CTL_APP_CLIENT_ID }}
          C8CTL_APP_PRIVATE_KEY: ${{ secrets.C8CTL_APP_PRIVATE_KEY }}
        run: node --experimental-strip-types scripts/agentic/app-token.ts create maintenance
      - name: Revalidate live controls and compare-and-swap generated files only
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          MAINTENANCE_PR: ${{ needs.prepare.outputs.pull_request }}
          MAINTENANCE_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          MAINTENANCE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/agentic/maintenance.ts apply
      - name: Revoke maintenance token
        if: ${{ always() && steps.app.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node --experimental-strip-types scripts/agentic/app-token.ts revoke
