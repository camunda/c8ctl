name: Release

on:
  push:
    branches: [ main, release ]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    # Reusable workflows can't exceed the caller's grant, and the permission check is
    # static: test.yml's agentic-revision job (never runs here) needs these read scopes.
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/test.yml
    with:
      os: '["ubuntu-latest"]'

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.18.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Smoke GitHub OIDC token exchange for npm publish 
        shell: bash
        run: |
          set -euo pipefail
          REG=$(npm -s config get registry||:); REG=${REG%/}; : "${REG:=https://registry.npmjs.org}"
          HOST=${REG#*://}; HOST=${HOST%%/*}
          ID=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${HOST}" | jq -er .value)
          PKG=$(jq -r '.name|@uri' package.json)
          RESP=$(curl -fsS -H "Authorization: Bearer $ID" "$REG/-/npm/v1/oidc/token/exchange/package/$PKG" -d "")
          TOKEN=$(echo "$RESP" | jq -er '.token')
          echo "::add-mask::$TOKEN"
          [ -n "$TOKEN" ]

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disabled while repo is private. See: https://github.com/camunda/c8ctl/issues/12
          NPM_CONFIG_PROVENANCE: 'false' 
        run: NODE_AUTH_TOKEN="" npx semantic-release

  notify-release-failure:
    needs: [test, release]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    permissions: {}
    uses: camunda/sdk-infra/.github/workflows/sdk-slack-notify.yml@v1.12.5
    with:
      repo-name: c8ctl
      workflow-name: Release
      mention-group: ${{ vars.SLACK_MENTION_GROUP }}
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_SDK_ALERTS }}
